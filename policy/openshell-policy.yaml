# K-BeautyGate OpenShell 샌드박스 정책
# 기본은 모두 거부(default deny). 아래에 적은 경로·호스트만 열린다.
# OpenShell 0.1.2 에서 실측 검증 (Brev 인스턴스, 2026-10-07). 과정은 docs/openshell-setup-log.md
#   openshell sandbox create --name kbg --from kbg-sandbox:v2 --policy ./policy/openshell-policy.yaml \
#     --provider nvidia --detach -- sleep infinity
version: 1

filesystem_policy:
  include_workdir: false      # [실측] 작업 폴더까지 쓰기로 열지 않는다. 쓰기는 output 만
  read_only:
    - /usr
    - /lib
    - /lib64                  # [실측] 파이썬 동적 로더
    - /bin
    - /sbin
    - /proc                   # [실측] 파이썬 런타임이 읽음
    - /dev/urandom
    - /etc
    - /app                    # 에이전트 코드 (root 소유. 에이전트가 자기 코드를 못 고침)
    - /sandbox
    - /hackathon/input        # 참고 자료: 읽기만
  read_write:
    - /hackathon/output       # 결과물(동선, 한글 카드, 신뢰성 보고서)만 쓰기
    - /tmp
    - /dev/null
  # /hackathon/restricted, /hackathon/secrets 는 어디에도 적지 않아 접근 자체가 불가능하다.

landlock:
  compatibility: best_effort

process:                      # [실측] 에이전트는 root 가 아닌 sandbox 사용자로 돈다
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  # Nemotron 추론: 프롬프트 전송이 필요하므로 POST 허용, 대상은 NVIDIA API 두 호스트로 한정
  nvidia_inference:
    name: NVIDIA NIM API
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/v1/chat/completions" }
          - allow: { method: POST, path: "/v1/embeddings" }
      - host: ai.api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/v1/retrieval/**" }
    binaries:
      - path: /usr/bin/python3
      - path: /usr/bin/python3.12   # [실측] 게이트웨이가 실제 실행 파일 경로로 판정한다

  # 공식 관광·행사 정보: 조회(GET)만 허용, 쓰기·업로드는 차단
  # [실측] 한 줄 형식({ host: ..., access: read-only })은 0.1.2 에서 읽히지 않아 rules 형식으로 적는다
  official_tourism_read_only:
    name: Official tourism sites
    endpoints:
      - host: english.visitkorea.or.kr
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: english.visitseoul.net
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
    binaries:
      - path: /usr/bin/python3
      - path: /usr/bin/python3.12   # [실측]

  # 비자기회귀 판단 모델(TypeSafe AI): 판단 질문 전송만 허용(POST /v1/systemone). 키는 provider 가 주입
  # [미시험] 프로필 openshell/typesafe-profile.yaml 과 함께 Brev 에서 확인할 것
  typesafe_judgment:
    name: TypeSafe judgment API
    endpoints:
      - host: api.typesafe.ai
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/v1/systemone" }
    binaries:
      - path: /usr/bin/python3
      - path: /usr/bin/python3.12

# 의도적으로 넣지 않은 것 (기본 거부로 차단됨)
# - 오픈마켓(amazon, ebay, aliexpress 등): 위장 K-뷰티 유통 경로
# - 자료 속 숨은 지시가 가리키는 업로드 주소(coupon-upload.example.net, validation-kculture.example)
# - 메일·예약·결제 API: 초안만 만들고 외부로 보내지 않는다
# 참고: english.visitkorea.or.kr 는 파이썬 기본 User-Agent 에 Cloudflare 403(1010)을 준다. OpenShell 과 무관.
