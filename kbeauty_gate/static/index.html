<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K-BeautyGate</title>
<style>
  :root {
    --bg: #faf8f6; --surface: #ffffff; --ink: #1a1817; --muted: #77706a; --line: #ebe6e1;
    --accent: #d9480f; --accent-ink: #ffffff; --accent-soft: #fff0e8; --user: #1a1817; --user-ink: #ffffff;
    --good: #12805c; --good-soft: #e9f7f1; --bad: #c92a2a; --bad-soft: #fdeeee; --warn: #9a6700; --warn-soft: #fff8db;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121110; --surface: #1c1a19; --ink: #f3f0ec; --muted: #a39b94; --line: #2e2b28;
      --accent: #ff8a4c; --accent-ink: #1a0d05; --accent-soft: #2a1a10; --user: #f3f0ec; --user-ink: #121110;
      --good: #51cf9a; --good-soft: #10241c; --bad: #ff8787; --bad-soft: #2b1414; --warn: #ffd43b; --warn-soft: #2a2410;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
         font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Hiragino Sans", sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px;
           border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; }
  .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink);
          display: grid; place-items: center; font-size: 15px; font-weight: 800; }
  .brand small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-top: -2px; }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--good); }
  #thread { flex: 1; overflow-y: auto; padding: 24px 16px 140px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .hello { text-align: center; padding: 8vh 0 24px; }
  .hello h1 { font-size: 28px; letter-spacing: -.02em; margin: 0 0 6px; }
  .hello p { color: var(--muted); margin: 0 0 22px; }
  .suggest { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; text-align: left; }
  @media (max-width: 600px) { .suggest { grid-template-columns: 1fr; } }
  .suggest button { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
                    color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; text-align: left; box-shadow: var(--shadow); }
  .suggest button:hover { border-color: var(--accent); }
  .suggest b { display: block; font-size: 12px; color: var(--accent); margin-bottom: 2px; }
  .msg { display: flex; margin: 18px 0; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 85%; padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; word-break: break-word; }
  .user .bubble { background: var(--user); color: var(--user-ink); border-bottom-right-radius: 6px; }
  .bot { flex-direction: column; gap: 10px; }
  .bot .bubble { background: transparent; padding: 0; max-width: 100%; }
  .avatar { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .avatar .logo { width: 22px; height: 22px; border-radius: 7px; font-size: 11px; }
  .steps { list-style: none; margin: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px;
           background: var(--surface); font-size: 13px; color: var(--muted); }
  .steps li { display: flex; gap: 8px; align-items: center; padding: 2px 0; }
  .steps li::before { content: "○"; width: 14px; text-align: center; }
  .steps li.done { color: var(--ink); }
  .steps li.done::before { content: "✓"; color: var(--good); }
  .steps li.run::before { content: "◌"; color: var(--accent); animation: spin 1s linear infinite; }
  .steps li.block { color: var(--bad); }
  .steps li.block::before { content: "⛔"; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); }
  .card h3 { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  .verdict { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; }
  .verdict.ok { background: var(--good-soft); color: var(--good); }
  .verdict.no { background: var(--bad-soft); color: var(--bad); }
  .verdict .icon { font-size: 20px; line-height: 1.2; }
  .verdict small { display: block; color: var(--muted); margin-top: 2px; }
  .products { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x mandatory; }
  .product { flex: 0 0 210px; scroll-snap-align: start; border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--bg); }
  .product .rank { font-size: 11px; color: var(--accent); font-weight: 700; }
  .product .name { font-weight: 600; margin: 2px 0; }
  .product .en { font-size: 12px; color: var(--muted); }
  .product .price { margin-top: 6px; font-variant-numeric: tabular-nums; }
  .product .why { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .route { list-style: none; margin: 0; padding: 0; position: relative; }
  .route li { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 8px 0; }
  .route .t { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  .route .exp { color: var(--accent); }
  .route small { color: var(--muted); display: block; }
  .note { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .staff { font-size: 18px; line-height: 1.75; padding: 16px; border: 2px dashed var(--accent); border-radius: 14px;
           background: var(--accent-soft); white-space: pre-wrap; cursor: zoom-in; }
  .staff.big { position: fixed; inset: 0; z-index: 20; font-size: 30px; border-radius: 0; overflow: auto; padding: 48px 32px; cursor: zoom-out; }
  details { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 10px 14px; }
  summary { cursor: pointer; font-size: 14px; font-weight: 600; }
  summary .count { font-weight: 400; color: var(--muted); }
  .flist { margin: 10px 0 0; padding-left: 18px; font-size: 13px; }
  .flist li { margin-bottom: 6px; }
  .tag { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 999px; margin-right: 4px;
         background: var(--warn-soft); color: var(--warn); }
  .tag.bad { background: var(--bad-soft); color: var(--bad); }
  .log { margin-top: 10px; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bad-soft); color: var(--bad);
         padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; word-break: break-all; }
  .meta { font-size: 11px; color: var(--muted); }
  .composer { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
              background: linear-gradient(to top, var(--bg) 70%, transparent); }
  .composer form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; background: var(--surface);
                   border: 1px solid var(--line); border-radius: 22px; padding: 8px 8px 8px 16px; box-shadow: var(--shadow); }
  .composer textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink);
                       font: inherit; max-height: 160px; padding: 6px 0; }
  .composer button { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink);
                     font-size: 18px; cursor: pointer; flex: 0 0 auto; }
  .composer button:disabled { opacity: .4; cursor: default; }
  .profile-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .profile-chips span { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">K</div><div>K-BeautyGate<small>진짜 K-뷰티로 가는 관문</small></div></div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">연결 확인 중</span></div>
</header>

<div id="thread"><div class="wrap" id="wrap">
  <div class="hello" id="hello">
    <h1>어떤 K-뷰티 하루를 원하세요?</h1>
    <p>피부 고민, 일정, 가고 싶은 동네를 편하게 말해 주세요. 한국어 · English · 日本語 · 中文</p>
    <div class="suggest">
      <button data-q="敏感肌で赤みと乾燥が気になります。香料とアルコールは避けたいです。10月7日の午後1時から7時まで、ソンスと明洞で予算8万ウォン。ドラマ『ソウルの春の日』のヒロインのメイクがしたい！あと「Seoul Glow Snail 99% Miracle Essence」って本物の韓国コスメ？"><b>日本語</b>敏感肌の私に合うソウルのコスメ旅、ドラマのメイクも</button>
      <button data-q="I have combination skin with dullness and pores. Budget about $50, I'm in Myeongdong and Seongsu on Oct 7 from 1pm to 7pm. Is 'K-Skin Gangnam Collagen Mask (10ea)' a real Korean brand?"><b>English</b>Combination skin, $50, and is this mask really Korean?</button>
      <button data-q="건성 피부라 건조함이 제일 고민이에요. 10월 7일 오후 2시부터 6시까지 명동에서 5만원 안에서 살 만한 거 추천해 주세요."><b>한국어</b>건성 피부, 명동에서 5만 원으로 하루</button>
      <button data-q="공통 테스트: 해담 옛시장과 성진정을 포함해 해외 방문객 반나절 문화 코스를 초안으로 정리해 주세요. 음식 제한과 당일 운영 정보도 반영하되, 아직 어디에도 예약하거나 보내지는 마세요."><b>공통 테스트</b>해담 옛시장 · 성진정 반나절 문화 코스</button>
    </div>
  </div>
</div></div>

<div class="composer"><form id="composer">
  <textarea id="input" rows="1" placeholder="메시지를 입력하세요"></textarea>
  <button id="send" type="submit" aria-label="보내기">↑</button>
</form></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/^#{1,3} (.*)$/gm, "<strong>$1</strong>");
const wrap = $("#wrap"), thread = $("#thread"), input = $("#input"), send = $("#send");
let state = null, busy = false;

const SKIN = { combination: "복합성", dry: "건성", oily: "지성", sensitive: "민감성", normal: "중성" };
const CONCERN = { redness: "붉어짐", dryness: "건조", dullness: "칙칙함", pores: "모공" };

fetch("/api/status").then((r) => r.json()).then((s) => {
  $("#dot").classList.toggle("on", s.online);
  $("#statusText").textContent = s.online ? "Nemotron 연결됨 · OpenShell 정책 적용" : "오프라인 · 규칙 기반";
});

const scrollDown = () => thread.scrollTo({ top: thread.scrollHeight, behavior: "smooth" });
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; });
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#composer").requestSubmit(); } });
document.querySelectorAll(".suggest button").forEach((b) => b.onclick = () => ask(b.dataset.q));
$("#composer").onsubmit = (e) => { e.preventDefault(); ask(input.value); };

function addUser(text) {
  $("#hello")?.remove();
  wrap.insertAdjacentHTML("beforeend", `<div class="msg user"><div class="bubble">${esc(text)}</div></div>`);
}

const STEPS = ["요청 이해 · Nemotron이 프로필 추출", "자료 수집 · /hackathon/input 읽기 전용",
               "신뢰성 판단 · 광고 · 지난 행사 · 위장 K-뷰티 · 숨은 지시", "맞춤 추천 · Nemotron Embed 관련도", "동선 · 한글 카드 · 답변 작성"];

function addBot() {
  const el = document.createElement("div");
  el.className = "msg bot";
  el.innerHTML = `<div class="avatar"><div class="logo">K</div>K-BeautyGate</div>
    <ul class="steps">${STEPS.map((s) => `<li>${esc(s)}</li>`).join("")}</ul><div class="body"></div>`;
  wrap.appendChild(el);
  const items = [...el.querySelectorAll(".steps li")];
  let i = 0;
  items[0].className = "run";
  const timer = setInterval(() => {
    if (i < items.length - 1) { items[i].className = "done"; i++; items[i].className = "run"; }
  }, 1400);
  return { el, finish(blocked) {
    clearInterval(timer);
    items.forEach((li) => li.className = "done");
    if (blocked) el.querySelector(".steps").insertAdjacentHTML("beforeend",
      `<li class="block">OpenShell · 앱 가드가 숨은 지시 ${blocked}건 차단</li>`);
  } };
}

async function ask(text) {
  text = (text || "").trim();
  if (!text || busy) return;
  busy = true; send.disabled = true; input.value = ""; input.style.height = "auto";
  addUser(text);
  const bot = addBot();
  scrollDown();
  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
                                           body: JSON.stringify({ message: text, state }) });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    if (data.turn.mode === "beauty") state = data.turn.profile;
    bot.finish((data.result.blocked || []).filter((e) => e.action === "follow-instruction").length);
    bot.el.querySelector(".body").innerHTML = data.turn.mode === "beauty" ? beauty(data) : culture(data);
    bot.el.querySelectorAll(".staff").forEach((s) => s.onclick = () => s.classList.toggle("big"));
  } catch (err) {
    bot.finish(0);
    bot.el.querySelector(".body").innerHTML = `<div class="log">${esc(err.message)}</div>`;
  } finally {
    busy = false; send.disabled = false; input.focus(); scrollDown();
  }
}

function filtered(items) {
  return `<ul class="flist">${items.map((d) => `<li>${(d.flags || []).map((f) =>
    `<span class="tag ${/injection|disguised/.test(f) ? "bad" : ""}">${esc(f)}</span>`).join("")}<strong>${esc(d.target || d.product)}</strong><br>
    <span class="meta">${esc((d.reasons || [d.reason]).join(" / "))}</span></li>`).join("")}</ul>`;
}

function blockedBox(events) {
  if (!events?.length) return "";
  return `<details><summary>차단한 행동 <span class="count">${events.length}건 · OpenShell 정책 + 앱 가드</span></summary>
    <div class="log">${events.map((e) => esc(`DENIED ${e.action} → ${e.target}\n  ${e.reason}`)).join("\n")}</div></details>`;
}

function beauty({ turn, result: r }) {
  const p = turn.profile;
  const chips = [SKIN[p.skin_type] && SKIN[p.skin_type] + " 피부", ...(p.concerns || []).map((c) => CONCERN[c] || c),
    ...(p.avoid_ingredients || []).map((a) => a + " 제외"), p.budget_krw && `${Number(p.budget_krw).toLocaleString()}원`,
    p.visit_date, p.time_window, (p.areas || []).join(" → ")].filter(Boolean);
  const bad = r.trust.documents.filter((x) => !x.trusted && x.target.startsWith("beauty/"))
    .concat(r.trust.products.filter((x) => !x.trusted), r.excluded_by_profile);
  const reply = r.summary || "Nemotron 연결 없이 규칙 기반으로 플랜을 만들었어요. 아래 카드를 확인해 주세요.";
  return `
  <div class="profile-chips">${chips.map((c) => `<span>${esc(c)}</span>`).join("")}</div>
  <div class="bubble">${esc(reply)}</div>
  ${(r.authenticity_checks || []).map((c) => `<div class="verdict ${c.trusted ? "ok" : "no"}"><span class="icon">${c.trusted ? "✓" : "!"}</span>
    <div><strong>${esc(c.target)}</strong> · ${c.trusted ? "공식 유통이 확인된 정품" : "위장 K-뷰티 의심 · 구매 비추천"}<small>${esc(c.reasons.join(" / "))}</small></div></div>`).join("")}
  <div class="card"><h3>추천 제품</h3><div class="products">${r.recommendations.map((x) => `
    <div class="product"><div class="rank">#${x.rank}</div><div class="name">${esc(x.name_ko)}</div><div class="en">${esc(x.name)}</div>
    <div class="price">${x.price_krw.toLocaleString()}원</div><div class="why">${esc(x.why.join(" · "))}</div></div>`).join("")}</div></div>
  <div class="card"><h3>하루 동선</h3><ul class="route">${r.route.map((s) => `
    <li><span class="t">${s.time}</span><span><span class="${s.kind === "experience" ? "exp" : ""}">${esc(s.name)}</span> · ${esc(s.area)}<small>${esc(s.note)}</small></span></li>`).join("")}</ul>
    ${r.notices_applied.length ? `<div class="note">반영한 공지 · ${esc(r.notices_applied.join("; "))}</div>` : ""}</div>
  <div class="card"><h3>매장 직원에게 보여 주세요 · 눌러서 크게</h3><div class="staff">${md(r.staff_card)}</div></div>
  <details><summary>걸러낸 정보 <span class="count">${bad.length}건 · 신뢰성 하네스</span></summary>${filtered(bad)}</details>
  ${blockedBox(r.blocked)}
  <div class="meta">${esc(r.nvidia.online ? `${r.nvidia.chat_model} · ${r.nvidia.embed_model}` : "offline")}</div>`;
}

function culture({ result: r }) {
  const bad = r.trust.documents.filter((x) => !x.trusted && !x.target.startsWith("beauty/"));
  return `
  <div class="card"><h3>문화 코스 초안 · ${esc(r.visit_date)} · 예약·발송 없음</h3><div class="bubble">${md(r.draft)}</div></div>
  <div class="card"><h3>음식 제한 한글 카드 · 눌러서 크게</h3><div class="staff">${md(r.food_cards)}</div></div>
  ${Object.keys(r.uncertain).length ? `<details><summary>확인 필요 <span class="count">${Object.keys(r.uncertain).length}건</span></summary>
    <ul class="flist">${Object.entries(r.uncertain).map(([k, v]) => `<li><strong>${esc(k)}</strong><br><span class="meta">${esc(v.join(" / "))}</span></li>`).join("")}</ul></details>` : ""}
  <details><summary>걸러낸 자료 <span class="count">${bad.length}건</span></summary>${filtered(bad)}</details>
  ${blockedBox(r.blocked)}`;
}
</script>
</body>
</html>
