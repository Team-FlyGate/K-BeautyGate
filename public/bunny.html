<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffe3ed">
<meta name="color-scheme" content="light only">
<meta name="description" content="토끼와 함께 고르는 K-뷰티 쇼핑 계획과 직원용 한국어 카드">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="K-BeautyGate">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>K-BeautyGate Bunny</title>
<style>
  :root {
    color-scheme: light;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", ui-rounded, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Hiragino Maru Gothic ProN", "Hiragino Sans", "PingFang SC", "Microsoft JhengHei", sans-serif;
    --round: ui-rounded, "SF Pro Rounded", var(--font);
    --sky1: #ffe3ed; --sky2: #ffd3e3; --sky3: #ffeaf2;
    --app1: #fff4f8; --app2: #ffe7f0; --fade: rgba(255, 242, 247, .94);
    --glass: rgba(255, 247, 250, .84); --solid: #fff8fb;
    --ink: #4a2b38; --muted: #9b6f83; --faint: #d3a5b8; --line: rgba(247, 182, 206, .6);
    --rose: #f27ba3; --rose-deep: #d64f80; --rose-soft: #ffdbe7; --rose-mist: #fff0f6;
    --grad1: #ffcadb; --grad2: #ffa9c7; --on-pink: #7a1f46; --title: linear-gradient(135deg, #ee5a8f, #ff9dc1);
    --lav: #e483b0; --lav-soft: #fde0ee;
    --ok: #3b8b68; --ok-soft: #e1f3e9; --hold: #a26e17; --hold-soft: #fdf0dc; --stop: #c03a5a; --stop-soft: #ffe0e8;
    --bubble: #ffe6ef; --art-bg: #f9dde2; --paper: #fff8fa; --paper-ink: #3a2830;
    --shadow: 0 14px 36px rgba(240, 120, 162, .18); --shadow-sm: 0 4px 14px rgba(240, 120, 162, .13);
    --rim: rgba(255, 255, 255, .7); --cloud: rgba(255, 255, 255, .55);
  }
  /* 시스템이 다크 모드여도 밝은 연핑크를 유지합니다. 어두운 화면은 data-theme="dark"를 직접 줄 때만 씁니다. */
  :root[data-theme="dark"] {
      color-scheme: dark;
      --sky1: #2b1a29; --sky2: #241a35; --sky3: #1a2134;
      --app1: #261a23; --app2: #20161e; --fade: rgba(36, 25, 33, .94);
      --glass: rgba(56, 39, 51, .78); --solid: #3a2934;
      --ink: #f9eaf0; --muted: #cbb0bd; --faint: #8f7483; --line: rgba(130, 88, 110, .5);
      --rose: #f58fb1; --rose-deep: #ffa6c4; --rose-soft: #4b2b3b; --rose-mist: #33222c;
      --grad1: #f9b3cc; --grad2: #f08cb2; --on-pink: #3a1424; --title: linear-gradient(135deg, #ff9dc1, #ffc6da);
      --lav: #f0a3c6; --lav-soft: #46293a;
      --ok: #9fd6b8; --ok-soft: #233a2f; --hold: #ebc88d; --hold-soft: #3d3122; --stop: #f6a3b6; --stop-soft: #47262f;
      --bubble: #362733; --shadow: 0 14px 36px rgba(0, 0, 0, .38); --shadow-sm: 0 4px 14px rgba(0, 0, 0, .28);
      --rim: rgba(255, 255, 255, .08); --cloud: rgba(255, 255, 255, .07);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 15px/1.6 var(--font); color: var(--ink); overflow: hidden; display: flex; justify-content: center;
    background:
      radial-gradient(900px 520px at 8% -8%, var(--sky2), transparent 62%),
      radial-gradient(760px 520px at 108% 6%, var(--sky3), transparent 60%),
      linear-gradient(180deg, var(--sky1), var(--app2));
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--rose); outline-offset: 3px; }
  img { display: block; }

  /* storybook sky around the app on wide screens */
  .sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .sky i { position: absolute; color: #fff; font-style: normal; opacity: .9; animation: twinkle 4s ease-in-out infinite; text-shadow: 0 0 12px rgba(244, 131, 166, .5); }
  .sky .cloud { position: absolute; width: 180px; height: 60px; border-radius: 60px; background: var(--cloud); filter: blur(1px); }
  .sky .cloud::before, .sky .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
  .sky .cloud::before { width: 80px; height: 80px; left: 26px; top: -38px; }
  .sky .cloud::after { width: 64px; height: 64px; left: 88px; top: -26px; }
  @keyframes twinkle { 50% { opacity: .25; transform: scale(.7); } }

  .app {
    position: relative; width: 100%; max-width: 480px; height: 100vh; height: 100dvh; overflow: hidden;
    background: linear-gradient(180deg, var(--app1), var(--app2)); isolation: isolate;
  }
  .app::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(260px 200px at 90% 12%, rgba(255, 150, 190, .16), transparent 70%), radial-gradient(240px 220px at 0% 60%, rgba(255, 175, 205, .16), transparent 70%); }
  @media (min-width: 720px) {
    body { align-items: center; }
    .app { height: min(920px, calc(100dvh - 48px)); border-radius: 44px; box-shadow: 0 40px 90px rgba(236, 110, 155, .25), inset 0 0 0 1px var(--rim); }
  }

  /* header: menu · persona · language (Muse layout) */
  .top { position: absolute; inset: 0 0 auto; z-index: 20; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start;
    padding: calc(12px + env(safe-area-inset-top)) 14px 22px; background: linear-gradient(to bottom, var(--fade) 58%, transparent); pointer-events: none; }
  .top > * { pointer-events: auto; }
  .glass-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--rim); background: var(--glass);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: var(--shadow-sm); display: grid; place-items: center; color: var(--ink); }
  .glass-btn svg { width: 20px; height: 20px; }
  .persona { justify-self: center; display: flex; flex-direction: column; align-items: center; border: 0; background: none; padding: 0; }
  .persona img { width: 54px; height: 54px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; background: var(--art-bg); box-shadow: 0 6px 18px rgba(214, 100, 140, .28); }
  .persona span { margin-top: -9px; padding: 3px 12px; border-radius: 999px; background: var(--solid); font: 650 12px/1.4 var(--round); letter-spacing: -.01em; box-shadow: var(--shadow-sm); }
  .lang-pill { justify-self: end; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--rim); background: var(--glass);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: var(--shadow-sm); font-weight: 650; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .lang-pill svg { width: 16px; height: 16px; color: var(--rose); }

  /* views */
  .view { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding: 104px 16px 188px; display: none; scroll-behavior: smooth; }
  .view.active { display: block; }
  .app[data-screen="chat"] .view { padding-bottom: 196px; }
  .wrap { max-width: 440px; margin: 0 auto; }

  /* welcome */
  .hello { text-align: center; padding: 4px 0 8px; animation: rise .5s ease both; }
  .hero { position: relative; width: 206px; height: 230px; margin: 0 auto 18px; }
  .hero-arch { position: absolute; inset: 0; overflow: hidden; border-radius: 110px 110px 34px 34px; background: var(--art-bg);
    box-shadow: 0 18px 40px rgba(214, 100, 140, .22), inset 0 0 0 4px rgba(255, 255, 255, .8); }
  .hero-arch img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; transform: scale(1.04); animation: bob 4.5s ease-in-out infinite; }
  .hero .spark { position: absolute; color: var(--rose); font-size: 18px; animation: twinkle 3s ease-in-out infinite; }
  .hero .s1 { left: -18px; top: 40px; } .hero .s2 { right: -16px; top: 18px; font-size: 24px; animation-delay: .8s; } .hero .s3 { right: -22px; bottom: 46px; font-size: 13px; animation-delay: 1.6s; } .hero .s4 { left: -10px; bottom: 28px; font-size: 22px; color: var(--lav); animation-delay: 2.2s; }
  .eyebrow { color: var(--rose-deep); font: 700 11px/1.4 var(--round); letter-spacing: .16em; text-transform: uppercase; margin-bottom: 8px; }
  .hello h1 { font: 750 clamp(26px, 7vw, 32px)/1.3 var(--round); letter-spacing: -.035em; margin: 0 0 10px; }
  .hello h1 em { font-style: normal; background: var(--title); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hello .intro { color: var(--muted); font-size: 14px; margin: 0 auto 22px; max-width: 340px; word-break: keep-all; }
  .suggest-label { text-align: left; font-size: 12px; font-weight: 650; color: var(--muted); margin: 0 4px 10px; }
  .suggest { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; text-align: left; }
  .suggest button { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding: 12px 13px 14px; border-radius: 22px; border: 1px solid var(--line);
    background: var(--glass); box-shadow: var(--shadow-sm); font-size: 13px; line-height: 1.45; min-width: 0; overflow-wrap: anywhere; transition: transform .2s, border-color .2s; }
  .suggest button:hover { transform: translateY(-2px); border-color: var(--rose); }
  .suggest .sg-art { width: 44px; height: 44px; border-radius: 14px; overflow: hidden; background: var(--art-bg); flex: 0 0 auto; }
  .suggest .sg-art img { width: 100%; height: 100%; object-fit: cover; }
  .suggest b { font-size: 11px; color: var(--rose-deep); font-weight: 700; }
  .presets { margin-top: 18px; text-align: left; display: grid; gap: 8px; }
  .preset { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; padding: 11px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--glass); box-shadow: var(--shadow-sm); font-size: 13.5px; font-weight: 600; text-align: left; color: var(--ink); }
  .preset:hover { border-color: var(--rose); background: var(--rose-mist); }
  .preset .pi { width: 26px; height: 26px; border-radius: 50%; background: var(--rose-soft); color: var(--rose-deep); display: grid; place-items: center; font-size: 12px; }
  .preset .pa { color: var(--rose); font-size: 18px; }
  .languages { font-size: 11px; color: var(--faint); letter-spacing: .04em; margin: 18px 0 0; }

  /* messages */
  .msg { margin: 14px 0; animation: rise .35s ease both; min-width: 0; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble { max-width: 84%; background: linear-gradient(135deg, var(--grad1), var(--grad2)); color: var(--on-pink); border-radius: 22px 22px 8px 22px; box-shadow: 0 8px 20px rgba(240, 120, 162, .22); }
  .bubble { padding: 11px 16px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
  .bot { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
  .bot > .bubble, .bubble.bot { align-self: flex-start; max-width: 94%; background: var(--bubble); border-radius: 22px 22px 22px 8px; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @keyframes bob { 50% { transform: translateY(-5px) scale(1.04); } }

  .panel { background: var(--glass); border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow-sm); padding: 14px; min-width: 0; }
  .panel-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .panel-head .art { width: 52px; height: 52px; border-radius: 16px; }
  .stop-panel { display: flex; gap: 14px; align-items: center; border: 2px solid #e58aa5; background: linear-gradient(135deg, #fff5f8, #fde3ea); }
  .stop-panel .art { width: 96px; height: 96px; border-radius: 22px; flex-shrink: 0; }
  .stop-panel b { display: block; font-size: 16px; color: #b23d61; }
  .stop-panel p { margin: 2px 0 6px; font-size: 13px; color: var(--muted, #8a6b76); }
  .stop-panel ul { margin: 0; padding-left: 18px; font-size: 13px; }
  .panel-head b { display: block; font: 700 15px/1.35 var(--round); letter-spacing: -.02em; }
  .panel-head small { display: block; color: var(--muted); font-size: 12px; }
  .art { overflow: hidden; background: var(--art-bg); flex: 0 0 auto; display: grid; place-items: center; color: var(--rose); }
  .art img { width: 100%; height: 100%; object-fit: cover; }

  /* my conditions */
  .mine { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .mine .label { font-size: 11px; color: var(--muted); font-weight: 650; margin-right: 2px; }
  .mine span.chip { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--rose-soft); color: var(--rose-deep); font-weight: 600; }

  /* product list (Muse list rows) */
  .plist { background: var(--bubble); border-radius: 26px; padding: 8px; }
  .plist-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 8px 10px 4px; }
  .plist-head b { font: 700 15px/1.3 var(--round); }
  .plist-head small { color: var(--muted); font-size: 11px; }
  .prow { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 8px; border: 0; border-radius: 18px; background: transparent; text-align: left; transition: background .2s; }
  .prow:hover { background: var(--glass); }
  .pthumb { position: relative; width: 58px; height: 58px; border-radius: 16px; }
  .pthumb i { position: absolute; left: -4px; top: -4px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--solid); color: var(--rose-deep); font: 800 11px/20px var(--round); text-align: center; font-style: normal; box-shadow: var(--shadow-sm); }
  .pinfo { min-width: 0; display: flex; flex-direction: column; }
  .pinfo b { font-size: 14.5px; line-height: 1.35; font-weight: 650; overflow-wrap: anywhere; }
  .pinfo small { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .pinfo em { font-style: normal; font-size: 13px; margin-top: 2px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .chev { color: var(--faint); font-size: 20px; }
  details.mini { margin: 4px 8px 6px; font-size: 12px; color: var(--muted); }
  details.mini summary { cursor: pointer; list-style: none; padding: 6px 2px; font-weight: 600; }
  details.mini summary::-webkit-details-marker { display: none; }
  details.mini summary::after { content: " ⌄"; }
  details.mini ul { margin: 4px 0 6px; padding-left: 16px; }
  details.mini li { margin: 3px 0; }

  /* verify card */
  .verify .vf-pill { margin-left: auto; align-self: flex-start; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .v-ok .vf-pill { background: var(--ok-soft); color: var(--ok); }
  .v-hold .vf-pill { background: var(--hold-soft); color: var(--hold); }
  .v-warn .vf-pill { background: var(--stop-soft); color: var(--stop); }
  .v-stop .vf-pill { background: var(--stop); color: #fff; }
  .verify ul, .notes ul, .sr-body ul, .promise ul { margin: 0; padding: 0; list-style: none; }
  .verify li, .notes li { position: relative; padding: 4px 0 4px 20px; font-size: 13.5px; overflow-wrap: anywhere; }
  .verify li::before { content: "•"; position: absolute; left: 6px; color: var(--rose); }
  .v-ok li::before { content: "✓"; left: 3px; color: var(--ok); }

  /* route timeline */
  .timeline { list-style: none; margin: 4px 0 0; padding: 0; }
  .timeline li { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 12px; }
  .timeline .t { font: 650 11.5px/1.4 var(--round); color: var(--rose-deep); padding-top: 3px; font-variant-numeric: tabular-nums; }
  .timeline .stop { position: relative; border-left: 2px dotted var(--line); padding: 0 0 18px 16px; min-width: 0; overflow-wrap: anywhere; }
  .timeline li:last-child .stop { padding-bottom: 2px; border-left-color: transparent; }
  .timeline .stop::before { content: ""; position: absolute; left: -7px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--rose); box-shadow: 0 0 0 4px var(--rose-soft); }
  .timeline .experience .stop::before { background: var(--lav); box-shadow: 0 0 0 4px var(--lav-soft); }
  .timeline b { font-size: 14.5px; font-weight: 650; }
  .timeline .area { color: var(--muted); font-size: 12.5px; }
  .timeline small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .timeline .orig { font-size: 11px; color: var(--faint); }
  .maps { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); display: grid; gap: 10px; }
  .maps h4 { margin: 0 0 6px; font-size: 12px; font-weight: 650; }
  .map-links { display: flex; flex-wrap: wrap; gap: 6px; }
  .map-link { display: inline-flex; align-items: center; min-height: 34px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--solid); color: var(--ink); text-decoration: none; font-size: 12px; }
  .map-link.kakao { background: #fff3b8; border-color: #efe0a0; color: #5b4a28; }
  .hint { font-size: 11.5px; color: var(--muted); margin: 6px 0 0; }

  /* action card (Muse confirm card) */
  .action-card { background: var(--solid); border: 1px solid var(--line); border-radius: 26px; padding: 16px; box-shadow: var(--shadow); }
  .ac-head { display: flex; align-items: center; gap: 10px; }
  .ac-icon { width: 36px; height: 36px; border-radius: 12px; background: var(--rose-soft); color: var(--rose-deep); display: grid; place-items: center; flex: 0 0 auto; }
  .ac-icon svg { width: 20px; height: 20px; }
  .ac-head b { font: 700 15px/1.35 var(--round); }
  .ac-desc { color: var(--muted); font-size: 12.5px; margin: 6px 0 12px; }
  .ac-preview { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; align-items: center; background: var(--paper); color: var(--paper-ink); border-radius: 20px; padding: 10px; margin-bottom: 12px; border: 1px solid rgba(232, 98, 140, .18); }
  .ac-preview .art { width: 84px; height: 84px; border-radius: 16px; }
  .ac-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { height: 46px; padding: 0 16px; border-radius: 999px; border: 0; font-weight: 700; font-size: 14.5px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
  .btn.ghost { background: var(--bubble); color: var(--ink); }
  .btn.primary { background: linear-gradient(135deg, var(--grad1), var(--grad2)); color: var(--on-pink); box-shadow: 0 8px 18px rgba(240, 120, 162, .24); }
  .btn.link { background: none; color: var(--rose-deep); }
  .btn.wide { width: 100%; }

  /* Korean cards */
  .ko-card { font-size: 13.5px; line-height: 1.65; overflow-wrap: anywhere; max-height: 168px; overflow: hidden; position: relative; }
  .ko-card::after { content: ""; position: absolute; inset: auto 0 0; height: 30px; background: linear-gradient(to top, var(--paper), transparent); }
  .ko-card h4 { margin: 0 0 4px; font-size: 13px; color: var(--rose-deep); }
  .ko-card p { margin: 0 0 4px; }
  .ko-card ul { margin: 2px 0 6px; padding-left: 18px; }
  .ko-card strong { color: #b23d64; }
  .food-list { display: grid; gap: 10px; }
  .food-item { background: var(--paper); color: var(--paper-ink); border-radius: 18px; padding: 12px; border: 1px solid rgba(232, 98, 140, .18); }
  .food-item .ko-card { max-height: 132px; }
  .food-item .ac-actions { margin-top: 10px; }
  .food-item .btn { height: 38px; font-size: 13px; }

  /* status row (Muse "Browser · Blocked") */
  details.status-row { background: var(--glass); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow-sm); overflow: hidden; }
  details.status-row > summary { list-style: none; display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; cursor: pointer; }
  details.status-row > summary::-webkit-details-marker { display: none; }
  .sr-icon { width: 42px; height: 42px; border-radius: 14px; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; }
  .sr-icon.alert { background: var(--rose-soft); color: var(--rose-deep); }
  .sr-icon svg { width: 22px; height: 22px; }
  .sr-text b { display: block; font-size: 14px; font-weight: 700; }
  .sr-text small { display: block; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .sr-chev { color: var(--faint); transition: transform .2s; }
  details[open] > summary .sr-chev { transform: rotate(180deg); }
  .sr-body { padding: 0 16px 14px 16px; display: grid; gap: 12px; }
  .sr-body h5, .group h5 { margin: 0 0 4px; font-size: 12px; color: var(--muted); font-weight: 700; }
  .sr-body li, .group li { font-size: 13px; padding: 3px 0 3px 18px; position: relative; overflow-wrap: anywhere; }
  .sr-body li::before, .group li::before { content: "✕"; position: absolute; left: 0; color: var(--rose); font-size: 11px; top: 5px; }
  .sr-body li.f::before, .group li.f::before { content: "–"; color: var(--muted); }
  .count { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--rose-soft); color: var(--rose-deep); font-size: 11px; font-weight: 700; text-align: center; margin-left: 4px; }
  .go-safety { justify-self: start; border: 0; background: none; color: var(--rose-deep); font-weight: 650; font-size: 12.5px; padding: 0; }

  /* notices, caveats */
  .notes.notice { background: var(--hold-soft); border-color: transparent; }
  .notes.notice .panel-head b { color: var(--hold); }
  .notes li { padding-left: 16px; }

function onAction(e) {
  const target = e.target.closest("[data-q],[data-pid],[data-card],[data-copy],[data-view],[data-lang],[data-new],[data-retry]");
  if (!target || target.disabled) return;
  const d = target.dataset;
  if (d.q) { closeOverlays(); ask(d.q); }
  else if (d.retry) ask(d.retry);
  else if (d.pid) { const [turnId, index] = d.pid.split(":"); openSheet(productSheet(turnId, Number(index))); }
  else if (d.card) { closeOverlays(); openCard(d.card, target); }
  else if (d.copy) copyCard(d.copy);
  else if (d.view) { closeOverlays(); switchView(d.view); }
  else if (d.lang) { chooseLanguage(d.lang); closeOverlays(); refreshViews(); }

}

// 답이 오면 맨 아래가 아니라, 방금 한 질문이 화면 위쪽에 오도록 맞춰 답을 처음부터 읽게 한다
const scrollToTurn = (el) => requestAnimationFrame(() => {
  if (!el) return scrollDown();
  const top = el.getBoundingClientRect().top - els.chat.getBoundingClientRect().top + els.chat.scrollTop - 12;
  els.chat.scrollTo({ top: Math.max(0, top), behavior: "smooth" });

function addLoading() {
  const l = I18N[uiLanguage];
  const el = document.createElement("div");
  el.className = "msg bot"; el.lang = uiLanguage;
  el.innerHTML = `<div class="loading" role="status">${art("search")}<div><b>${esc(l.loadingTitle)}</b><ol class="steps">${l.steps.map((step, i) => `<li class="${i ? "" : "on"}">${esc(step)}</li>`).join("")}</ol></div></div>`;

async function ask(text) {
  text = String(text || "").trim();

  document.querySelectorAll(".chip-q").forEach((chip) => { chip.disabled = true; });
  if (els.app.dataset.screen !== "chat") switchView("chat");
  const requested = explicitLanguage(text);
  const requestLanguage = requested ? normalizeLanguage(requested) : (preferredLanguage || detectLanguage(text, uiLanguage));
  setLanguage(requestLanguage);
  state = { ...(state || {}), language: uiLanguage, ...languageState() };
  addUser(text);
  const question = els.thread.lastElementChild;
  const bot = addLoading(); scrollDown();
  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text, state: state || { language: uiLanguage } }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
    if (!data.turn || !data.result) throw new Error("unexpected response");
    setLanguage(requestLanguage);
    state = { ...(state || {}), ...(data.turn.profile || {}), language: requestLanguage, ...languageState() };
    const presentation = { ...data, turn: { ...data.turn, language: requestLanguage } };
    const turnId = `t${++memory.seq}`;
    bot.done(renderResult(presentation, turnId), requestLanguage);
    remember(presentation, turnId); markTabs();
  } catch (err) {
    const l = I18N[uiLanguage];

  } finally {

  }
}

  const card = CARDS[id];
  if (!card) return;
  cardOpener = opener || document.activeElement;
  els.cardview.dataset.card = id;
  document.getElementById("cvBody").innerHTML = richText(card.text, "ko");
  els.cardview.hidden = false; document.getElementById("cvClose").focus();
}
function closeCard() {
  els.cardview.hidden = true;
  if (cardOpener && document.contains(cardOpener)) cardOpener.focus();
  cardOpener = null;
}
function toast(message) {
  els.toast.textContent = message; els.toast.classList.add("on");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => els.toast.classList.remove("on"), 2200);
}
async function copyCard(id) {
  const card = CARDS[id], l = I18N[uiLanguage];
  if (!card) return;
  const text = plainCard(card.text);
  try {
    if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
    else {
      const area = document.createElement("textarea"); area.value = text; area.style.position = "fixed"; area.style.opacity = "0";
      document.body.appendChild(area); area.select(); const ok = document.execCommand("copy"); area.remove(); if (!ok) throw new Error("copy");
    }
    toast(l.copied);
  } catch { toast(l.copyFail); }
}
function setupVoice() {
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition) { els.app.classList.add("no-voice"); return; }
  let rec = null;
  els.mic.onclick = () => {
    if (rec) { rec.stop(); return; }
    rec = new Recognition(); rec.lang = SPEECH_LANG[uiLanguage]; rec.interimResults = true; rec.continuous = false;
    const base = els.input.value;
    rec.onresult = (e) => { els.input.value = base + [...e.results].map((result) => result[0].transcript).join(""); syncComposer(); };
    rec.onend = () => { rec = null; els.mic.classList.remove("on"); els.input.placeholder = I18N[uiLanguage].placeholder; };
    rec.onerror = () => { els.app.classList.toggle("no-voice", true); };
    els.mic.classList.add("on"); els.input.placeholder = I18N[uiLanguage].listening;
    try { rec.start(); } catch { rec = null; els.mic.classList.remove("on"); }
  };
}
if (typeof document !== "undefined" && document.getElementById("app")) boot();
</script>
