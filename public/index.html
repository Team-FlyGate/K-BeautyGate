<style>
  :root {
    color-scheme: light dark;
    --bg: #fbf3f1; --surface: #fffbfa; --ink: #3d2f33; --muted: #7d6870; --line: #f0dcdd;
    --accent: #b14f6b; --accent-ink: #fff; --accent-soft: #fbe3e6; --user: #e8a3b1; --user-ink: #3d2128;
    --good: #2f6b45; --good-soft: #e8f1ea; --bad: #aa5562; --bad-soft: #fae9e9; --warn: #87653b; --warn-soft: #f8f0df;
    --shadow: 0 10px 30px rgba(192, 96, 122, .08); --hero: #f8dcdd;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #241c20; --surface: #2e242a; --ink: #f8ecef; --muted: #c4b0b8; --line: #4b3640;

      --shadow: none; --hero: #4d3340; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
    font: 15px/1.65 "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Hiragino Sans", sans-serif; }
  button, textarea { font: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, [role="button"]:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  [hidden] { display: none !important; }
  body { background: radial-gradient(1200px 600px at 85% -10%, #fbe1ea 0%, transparent 60%), radial-gradient(900px 600px at -10% 60%, #f3e6f7 0%, transparent 55%), var(--bg); }
  @media (prefers-color-scheme: dark) { body { background: radial-gradient(1200px 600px at 85% -10%, #3e2733 0%, transparent 60%), var(--bg); } }
  header, .composer { background: transparent !important; }
  header { backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

  .tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .tabs button { border: 0; background: transparent; color: var(--muted); border-radius: 999px; padding: 6px 16px; font-size: 13px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
  .header-note { display: none; }
  #cardsView { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 20px 60px; }
  body.cards-tab #thread, body.cards-tab .composer { display: none; }
  .cards-intro { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; }
  .cards-intro img { width: 64px; height: 64px; border-radius: 18px; object-fit: cover; }
  .cards-intro h2 { margin: 0; font-size: 20px; }
  .cards-intro p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .card-context { font-size: 12px; color: var(--muted); margin: 18px 4px 6px; }
  .cards-empty { text-align: center; padding: 30px 0; color: var(--muted); }
  .cards-empty img { width: 150px; height: 150px; border-radius: 36px; object-fit: cover; display: block; margin: 0 auto 14px; }
  .cards-empty button { margin-top: 14px; border: 0; border-radius: 999px; padding: 11px 22px; color: #fff; font-weight: 650; cursor: pointer; background: linear-gradient(135deg, #f08aa8, #d9577f); }
  .card-rabbit { width: 46px; height: 46px; border-radius: 14px; object-fit: cover; float: right; margin: -6px -4px 6px 10px; box-shadow: var(--shadow); }
  .safety { background: linear-gradient(135deg, var(--surface), var(--accent-soft)); }
  .safety-head { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
  .safety-head img { width: 56px; height: 56px; border-radius: 16px; object-fit: cover; }
  .safety-head h3 { margin: 0; }
  .safety-head p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  .safety-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .safety-stats div { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 6px; text-align: center; font-size: 11px; color: var(--muted); }
  .safety-stats b { display: block; font-size: 24px; line-height: 1.2; color: var(--accent); }
  .promises { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .promises li { padding: 3px 0; }
  .promises li::before { content: "♡"; color: var(--accent); margin-right: 8px; font-weight: 700; }
  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    padding: 17px max(22px, calc((100vw - 1000px)/2)); border-bottom: 1px solid var(--line); background: var(--bg); z-index: 5; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 750; letter-spacing: -.04em; font-size: 18px; flex-shrink: 0; }
  .logo { width: 36px; height: 38px; border-radius: 18px 18px 10px 10px; background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center; font-family: Georgia, serif; font-size: 23px; font-weight: 500; }
  .brand small { display: block; font-weight: 400; color: var(--muted); font-size: 10px; letter-spacing: .025em; margin-top: -4px; }
  .header-note { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .check-why { display: block; margin-top: 4px; font-size: 12px; opacity: .85; }
  .back-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }
  .lang-switch { display: flex; gap: 4px; flex-wrap: wrap; }
  .lang-switch button { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px;
    padding: 4px 10px; font-size: 12px; cursor: pointer; line-height: 1.4; }
  .lang-switch button:hover { color: var(--ink, inherit); border-color: var(--accent); }
  .lang-switch button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 650; }
  .status { font-size: 11px; color: var(--muted); overflow-wrap: anywhere; max-width: 100%; }
  .dot { display: inline-block; width: 6px; height: 6px; margin-right: 5px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--good); }
  #thread { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 20px 170px; scroll-behavior: smooth; }
  .wrap { max-width: 720px; min-width: 0; margin: 0 auto; }
  .hello { text-align: center; padding: 20px 0 12px; }
  .mascot-slot { position: relative; width: 108px; height: 108px; margin: 0 auto 18px; display: grid; place-items: center;
    background: radial-gradient(circle at 30% 20%, var(--surface), var(--hero)); border-radius: 46% 54% 45% 55%; }
  .mascot-slot::after { content: "✦"; position: absolute; right: -8px; top: 4px; color: var(--accent); font-size: 20px; }
  .mascot-slot img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; border-radius: inherit; }
  .mascot-slot { width: 148px; height: 148px; overflow: visible; box-shadow: var(--shadow); background: #f8dcdd; }
  .brand > div:last-child { font-family: "DM Serif Display", Georgia, serif; font-weight: 400; letter-spacing: -.01em; font-size: 21px; }
  .brand > div:last-child small { font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", sans-serif; }

  .gate-mark { width: 62px; height: 66px; color: var(--accent); }
  .eyebrow { color: var(--accent); font-size: 10px; font-weight: 600; letter-spacing: .19em; margin-bottom: 9px; }
  .hello h1 { font-size: clamp(28px, 4vw, 39px); line-height: 1.35; font-weight: 650; letter-spacing: -.045em; margin: 0 0 12px; }
  .hello h1 em { font-style: normal; color: var(--accent); }
  .hello p { color: var(--muted); margin: 0 auto 24px; font-size: 14px; max-width: 460px; word-break: keep-all; }
  .suggest-label { text-align: left; font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  .suggest { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; text-align: left; }
  .suggest button { position: relative; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 17px 34px 18px 18px;
    color: var(--ink); font-size: 14px; line-height: 1.55; cursor: pointer; text-align: left; box-shadow: var(--shadow); min-width: 0;
    transition: border-color .2s, background .2s; overflow-wrap: anywhere; }
  .suggest button::after { content: "↗"; position: absolute; right: 15px; top: 17px; color: var(--accent); }
  .suggest button:hover { border-color: var(--accent); background: var(--accent-soft); }
  .suggest b { display: block; font-size: 10px; font-weight: 550; color: var(--accent); margin-bottom: 9px; }
  .hello .languages { font-size: 10px; letter-spacing: .07em; margin: 20px auto 0; }
  .msg { display: flex; margin: 25px 0; min-width: 0; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 88%; padding: 13px 18px; border-radius: 22px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user .bubble { background: var(--user); color: var(--user-ink); border-bottom-right-radius: 7px; }
  .bot { flex-direction: column; gap: 13px; }
  .bot .bubble { background: var(--surface); border: 1px solid var(--line); max-width: 100%; margin-bottom: 14px; }
  .card .bubble { border: 0; padding: 0; margin-bottom: 0; background: transparent; }
  .body { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .body > .bubble { margin-bottom: 0; }
  .avatar { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
  .avatar .logo { width: 25px; height: 27px; border-radius: 14px 14px 8px 8px; font-size: 16px; }
  .steps { list-style: none; margin: 0; padding: 13px 16px; border: 1px solid var(--line); border-radius: 16px;
    background: var(--surface); font-size: 12px; color: var(--muted); }
  .steps li { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
  .steps li::before { content: "○"; width: 14px; text-align: center; }
  .steps li.done { color: var(--ink); }
  .steps li.done::before { content: "✓"; color: var(--good); }
  .steps li.run::before { content: "◌"; color: var(--accent); animation: spin 1s linear infinite; }
  .steps li.block { color: var(--bad); }
  .steps li.block::before { content: "!"; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 50% { opacity: .35; transform: translateY(-3px); } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 23px; padding: 20px; box-shadow: var(--shadow); min-width: 0; }
  .card h3 { margin: 0 0 15px; font-size: 14px; color: var(--ink); font-weight: 600; letter-spacing: -.02em; }
  .card h3 .subtitle { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  .verdict { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 20px; font-size: 13px; overflow-wrap: anywhere; }
  .verdict.ok { background: var(--good-soft); color: var(--good); }
  .verdict.no { background: var(--warn-soft); color: var(--warn); }
  .verdict .icon { font-size: 15px; line-height: 24px; flex: 0 0 24px; text-align: center; border: 1px solid currentColor; border-radius: 50%; }
  .verdict small { display: block; color: var(--muted); margin-top: 4px; }
  .products { display: flex; gap: 12px; overflow-x: auto; padding: 1px 1px 8px; scroll-snap-type: x mandatory; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .product { flex: 0 0 215px; scroll-snap-align: start; border: 1px solid var(--line); border-radius: 18px; padding: 17px; background: var(--bg); overflow-wrap: anywhere; }
  .product .rank { display: inline-block; font-size: 10px; color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 8px; margin-bottom: 13px; font-weight: 600; }
  .product .name { font-weight: 650; margin: 2px 0; font-size: 15px; }
  .product .en { font-size: 11px; color: var(--muted); }
  .product .price { margin-top: 14px; font-size: 17px; font-weight: 550; font-variant-numeric: tabular-nums; }
  .product .why { font-size: 12px; color: var(--muted); margin-top: 9px; }
  .route { list-style: none; margin: 0; padding: 0; }
  .route li { display: grid; grid-template-columns: 79px minmax(0, 1fr); gap: 16px; padding: 0; font-size: 14px; }
  .route li > span:last-child { border-left: 1px solid var(--line); padding: 0 0 23px 18px; position: relative; overflow-wrap: anywhere; }
  .route li > span:last-child::before { content: ""; width: 7px; height: 7px; background: var(--accent); border-radius: 50%; position: absolute; top: 8px; left: -4px; }
  .route li:last-child > span:last-child { padding-bottom: 0; }
  .route .t { font-variant-numeric: tabular-nums; color: var(--accent); font-size: 11px; padding-top: 3px; }
  .route .exp { color: var(--accent); }
  .route small { color: var(--muted); display: block; font-size: 12px; margin-top: 3px; }
  .route .route-original { font-size: 11px; margin-top: 4px; }
  .area-searches { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); display: grid; gap: 14px; }
  .area-search h4 { margin: 0 0 8px; font-size: 12px; font-weight: 600; }
  .map-links { display: flex; flex-wrap: wrap; gap: 8px; }
  .map-link { display: inline-flex; align-items: center; min-height: 36px; max-width: 100%; padding: 7px 12px; border: 1px solid var(--line);
    border-radius: 24px; color: var(--ink); background: var(--surface); text-decoration: none; font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
  .map-link.kakao { background: #fff4bf; border-color: #eee0a0; color: #5b4a28; }
  .map-link:hover { border-color: var(--accent); }
  .map-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .area-searches .note { margin: 0; }
  .followups { margin: 4px 0 2px; }
  .followup-label { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  .followup-options { display: flex; flex-wrap: wrap; gap: 8px; }
  .followup-choice { display: flex; align-items: center; gap: 6px; max-width: 100%; min-width: 0; }
  .followup-chip { font: inherit; font-size: 12px; line-height: 1.5; text-align: left; color: var(--accent); background: var(--accent-soft);
    border: 1px solid var(--line); border-radius: 22px; padding: 9px 14px; cursor: pointer; overflow-wrap: anywhere; min-width: 0; }
  .followup-chip:hover:not(:disabled) { border-color: var(--accent); background: var(--surface); }
  .followup-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .followup-chip:disabled { opacity: .4; cursor: default; }
  .followup-source { font-size: 10px; color: var(--muted); }
  .note { font-size: 12px; color: var(--muted); margin-top: 12px; overflow-wrap: anywhere; }
  .staff { font-size: 17px; line-height: 1.8; padding: 21px; border: 1px dashed var(--accent); border-radius: 18px;
    background: var(--accent-soft); white-space: pre-wrap; overflow-wrap: anywhere; cursor: zoom-in; }
  .staff.big { position: fixed; inset: 0; z-index: 20; font-size: clamp(22px, 4vw, 32px); border: 0; border-radius: 0; overflow: auto; padding: 85px max(24px, calc((100vw - 760px)/2)) 40px; cursor: zoom-out; }
  .staff-close { position: fixed; top: 20px; right: 20px; z-index: 21; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 30px; padding: 10px 18px; cursor: pointer; }
  body.staff-open #thread { overflow: hidden; }
  details { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); padding: 15px 18px; overflow-wrap: anywhere; }
  summary { cursor: pointer; font-size: 13px; font-weight: 600; }
  summary .count { font-weight: 400; color: var(--muted); }
  .flist { margin: 10px 0 0; padding-left: 18px; font-size: 12px; }
  .flist li { margin-bottom: 7px; }
  .tag { display: inline-block; font-size: 10px; padding: 1px 8px; border-radius: 999px; margin-right: 4px; background: var(--warn-soft); color: var(--warn); }
  .tag.bad { background: var(--bad-soft); color: var(--bad); }
  .tag.ok { background: var(--good-soft); color: var(--good); }
  .saved { font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); overflow-wrap: anywhere; }
  .log { margin-top: 10px; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bad-soft); color: var(--bad);
    padding: 13px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .meta { font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
  .composer { position: fixed; left: 0; right: 0; bottom: 0; padding: 24px 20px calc(15px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 74%, transparent); z-index: 6; }
  .composer form { max-width: 720px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; background: var(--surface);
    border: 1px solid var(--line); border-radius: 25px; padding: 10px 10px 10px 19px; box-shadow: var(--shadow); }
  .composer form:focus-within { border-color: var(--accent); }
  .composer textarea { flex: 1; min-width: 0; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink);
    font: inherit; font-size: 16px; max-height: 160px; padding: 7px 0; }
  .composer textarea::placeholder { color: var(--muted); font-size: 14px; }
  .composer button { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink);
    font-size: 22px; cursor: pointer; flex: 0 0 auto; }
  .composer button:disabled { opacity: .45; cursor: default; }
  .composer-caption { text-align: center; font-size: 10px; color: var(--muted); margin: 8px 0 0; }
  .bs { display: none !important; }
  body.backstage .bs { display: block !important; }
  body.backstage .header-note { display: none; }
  .friendly { display: flex; gap: 17px; align-items: center; font-size: 14px; line-height: 1.75; color: var(--accent);
    padding: 20px; border: 1px solid var(--line); border-radius: 24px; background: var(--surface); }
  .friendly:lang(ko) { word-break: keep-all; }
  .loading-gate { position: relative; width: 45px; height: 56px; flex: 0 0 45px; border: 2px solid var(--accent);
    border-radius: 24px 24px 3px 3px; background: var(--accent-soft); overflow: visible; perspective: 110px; }
  .loading-gate::after { content: "✦"; position: absolute; right: -12px; top: -14px; font-size: 15px; animation: breathe 2.4s ease-in-out infinite; }
  .loading-gate span { position: absolute; top: 0; bottom: 0; width: 50%; background: var(--hero); border: 1px solid var(--accent); }
  .loading-gate .left-door { left: 0; border-radius: 24px 0 0 0; transform-origin: left center; animation: gate-left 3s ease-in-out infinite; }
  .loading-gate .right-door { right: 0; border-radius: 0 24px 0 0; transform-origin: right center; animation: gate-right 3s ease-in-out infinite; }
  @keyframes gate-left { 0%, 100% { transform: rotateY(0deg); } 50%, 75% { transform: rotateY(-65deg); } }
  @keyframes gate-right { 0%, 100% { transform: rotateY(0deg); } 50%, 75% { transform: rotateY(65deg); } }
  .backstage-badge { font-size: 10px; padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .profile-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .profile-chips span { font-size: 11px; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  @media (max-width: 420px) {
    header { padding: 14px 18px; gap: 9px; }
    .brand { font-size: 16px; }
    .header-note { font-size: 10px; }
    #thread { padding: 14px 16px 158px; }
    .hello { padding-top: 13px; }
    .mascot-slot { width: 120px; height: 120px; margin-bottom: 15px; }
    .mascot-slot img { width: 104px; height: 104px; }
    .hello p { font-size: 12px; margin-bottom: 21px; }
    .suggest { gap: 9px; }
    .suggest button { padding: 14px 27px 15px 13px; font-size: 12px; border-radius: 17px; }
    .suggest button::after { right: 11px; top: 12px; }
    .card { padding: 16px; border-radius: 20px; }
    .staff { font-size: 16px; padding: 16px; }
    .composer { padding-left: 16px; padding-right: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; scroll-behavior: auto !important; transition: none !important; } }
</style>

        promises: ["不会预订、付款或发送消息。", "只查看约定的资料。", "不会打开受保护的信息。", "不执行资料中隐藏的指令。"] },
  "zh-Hant": { title: "安心筆記", sub: "兔子在這次回答中確認並過濾的內容。", stats: ["未執行的隱藏指令", "從計畫中剔除的資訊", "沒有執行的操作"], head: "兔子的承諾",
        promises: ["不會預訂、付款或傳送訊息。", "只查看約定的資料。", "不會開啟受保護的資訊。", "不執行資料中隱藏的指令。"] },
};
function safetyNote(r, removed, lang) {
  const t = SAFETY[normalizeLanguage(lang)] || SAFETY.en;
  const blocked = Array.isArray(r.blocked) ? r.blocked : [];
  const hidden = blocked.filter((e) => e.action === "follow-instruction").length;
  const notDone = Math.max(blocked.length - hidden, Array.isArray(r.refusals) ? r.refusals.length : 0);
  return `<div class="card safety"><div class="safety-head"><img src="${RABBIT.heart}" alt=""><div><h3>${esc(t.title)}</h3><p>${esc(t.sub)}</p></div></div>
  <div class="safety-stats">${[hidden, removed, notDone].map((n, i) => `<div><b>${Number(n) || 0}</b>${esc(t.stats[i])}</div>`).join("")}</div>
  <strong>${esc(t.head)}</strong><ul class="promises">${t.promises.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
}
function savedBox(paths) {
  if (!paths?.length) return "";
  return `<div class="card bs"><h3>저장 위치 · 초안만 저장, 외부 발송 없음</h3><div class="saved">${paths.map(esc).join("<br>")}</div></div>`;
}
function blockedBox(events) {
  if (!events?.length) return "";
  return `<details class="bs"><summary>따르지 않은 행동 <span class="count">${events.length}건 · 앱 판단 기록</span></summary><div class="log">${events.map((e) => esc(`DENIED ${e.action} → ${e.target}\n  ${e.reason}`)).join("\n")}</div><div class="note">OpenShell의 실제 강제 차단 여부는 별도 실행 기록에서 확인합니다.</div></details>`;
}
function followupChips(suggestions, lang) {
  if (!Array.isArray(suggestions)) return "";
  const choices = suggestions.filter((item) => {
    const text = item?.text;
    return typeof text === "string" && text.trim() && !TECHNICAL.test(text)
      && ![...modelNames].some((model) => model && text.toLowerCase().includes(model.toLowerCase()));
  });
  if (!choices.length) return "";
  const label = I18N[normalizeLanguage(lang)].followups;
  return `<div class="followups" role="group" aria-label="${esc(label)}"><p class="followup-label">${esc(label)}</p><div class="followup-options">${choices.map((item) =>
    `<div class="followup-choice"><button type="button" class="followup-chip" data-question="${esc(item.text)}">${esc(item.text)}</button>${["rule", "nemotron"].includes(item.source) ? `<span class="bs followup-source">${item.source}</span>` : ""}</div>`
  ).join("")}</div></div>`;
}
function disableFollowups() {
  wrap.querySelectorAll(".followup-chip").forEach((button) => { button.disabled = true; });
}
function bindFollowups(el) {
  el.querySelectorAll(".followup-chip").forEach((button) => {
    button.onclick = () => { if (!busy && !button.disabled) ask(button.dataset.question); };
  });
}
function areaSearchLinks(route, lang) {
  const l = I18N[normalizeLanguage(lang)];
  const areas = [...new Set((Array.isArray(route) ? route : []).map((stop) => stop?.area)
    .filter((area) => ["명동", "성수", "홍대"].includes(area)))];
  if (!areas.length) return "";
  return `<div class="area-searches">${areas.map((area) => {
    const query = encodeURIComponent(area);
    const title = l.maps.area.replace("{}", l.areas[area]);
    return `<section class="area-search" aria-label="${esc(title)}"><h4>${esc(title)}</h4><div class="map-links">
      <a class="map-link kakao" href="https://map.kakao.com/link/search/${query}" target="_blank" rel="noopener noreferrer">${esc(l.maps.kakao)}</a>
      <a class="map-link" href="https://www.google.com/maps/search/?api=1&amp;query=${query}" target="_blank" rel="noopener noreferrer">${esc(l.maps.google)}</a>
    </div></section>`;
  }).join("")}<p class="note">${esc(l.maps.hint)}</p></div>`;
}
function beauty({ turn, result: r }) {
  const p = turn.profile || {};
  const lang = normalizeLanguage(turn.language || r.language || p.language || uiLanguage), l = I18N[lang];
  const localized = r.localized && normalizeLanguage(r.localized.language || lang) === lang ? r.localized : {};
  [r.nvidia?.chat_model, r.nvidia?.embed_model].filter(Boolean).forEach((name) => modelNames.add(name));
  const names = displayNameMap(r, localized, lang);
  const text = (value, fallback = "") => visitorText(value, lang, names, fallback);
  const show = (value, fallback = "") => esc(text(value, fallback));
  const originalName = (value) => {
    const original = publicText(value);
    return lang !== "ko" && /[\u3131-\u318e\uac00-\ud7a3]/.test(original)
      ? `<small class="route-original" lang="ko">${esc(original)}</small>` : "";
  };
  const chips = [l.skin[p.skin_type] && l.skin[p.skin_type] + l.skinSuffix, ...(p.concerns || []).map((c) => l.concerns[c] || text(c, l.translationPending)), ...(p.avoid_ingredients || []).map((a) => l.avoid.replace("{}", l.ingredients[a] || text(a, l.translationPending))), p.budget_krw && money(p.budget_krw, lang), p.visit_date, p.time_window, (p.areas || []).map((area) => l.areas[area] || text(area, l.translationPending)).join(" → ")].filter(Boolean);
  const bad = (r.trust?.documents || []).filter((x) => !x.trusted && (x.target || "").startsWith("beauty/")).concat((r.trust?.products || []).filter((x) => !x.trusted), r.excluded_by_profile || []);
  const reply = text(localized.summary || matchingText(text(r.summary), lang), l.reply);
  const notices = (localized.notices || (lang === "ko" ? r.notices_applied : []) || []).map((n) => text(n, l.translationPending)).filter(Boolean);
  const caveats = (localized.caveats || (lang === "ko" ? r.route_skipped : []) || []).map((n) => text(n, l.translationPending)).filter(Boolean);
  return `<div class="bubble">${esc(reply)}</div>
  <div class="profile-chips">${chips.map((c) => text(c, l.translationPending)).filter(Boolean).map((c) => `<span>${esc(c)}</span>`).join("")}</div>
  ${(r.authenticity_checks || []).map((c) => `<div class="verdict ${c.trusted ? "ok" : "no"}"><span class="icon">${c.trusted ? "✓" : "!"}</span><div><strong>${show(c.target, l.product + " · " + l.translationPending)}</strong><br>${esc(c.trusted ? l.checked : l.caution)}<small class="check-why" lang="ko">${esc((c.reasons || []).filter((x) => !/비자기회귀|Jev|라벨 메모|score|확률/.test(x)).slice(0, 2).join(" · "))}</small><small class="bs">${esc((c.reasons || []).join(" / "))}</small></div></div>`).join("")}
  <div class="card"><h3>${esc(l.picks)} <span class="subtitle">${esc(l.swipe)}</span></h3><div class="products">${(r.recommendations || []).map((x, index) => `<div class="product"><div class="rank">PICK ${Number.isInteger(x.rank) && x.rank > 0 ? x.rank : index + 1}</div><div class="name">${show(lang === "ko" ? x.name_ko || x.name : x.name || x.name_ko, l.product + " · " + l.translationPending)}</div>${lang === "ko" && x.name ? `<div class="en">${shown(x.name)}</div>` : ""}<div class="price">${esc(money(x.price_krw, lang))}</div><div class="why">${show((localized.recommendation_reasons?.[index] || (lang === "ko" ? x.why : []) || []).join("\n"), l.why)}</div></div>`).join("") || `<div class="note">${esc(l.empty)}</div>`}</div></div>
  <div class="card"><img class="card-rabbit" src="${RABBIT.map}" alt=""><h3>${esc(l.route)}</h3><ul class="route">${(r.route || []).map((stop, index) => `<li><span class="t">${show(stop.time)}</span><span><span class="${stop.kind === "experience" ? "exp" : ""}">${show(stop.name, l.place + " · " + l.translationPending)}</span> · ${show(l.areas[stop.area] || stop.area, l.translationPending)}${originalName(stop.name)}<small>${show(localized.route_notes?.[index] || (lang === "ko" ? stop.note : ""), l.translationPending)}</small></span></li>`).join("")}</ul>${areaSearchLinks(r.route, lang)}${notices.length ? `<div class="note">${esc(l.notices)} · ${esc(notices.join("; "))}</div>` : ""}</div>
  <div class="card"><img class="card-rabbit" src="${RABBIT.card}" alt=""><h3>${esc(l.staff)} <span class="subtitle">${esc(l.enlarge)}</span></h3><p class="note">${esc(l.staffHint)}</p><div class="staff" lang="ko" data-language="${lang}">${md(publicText(r.staff_card, "매장에 전달할 조건을 다시 확인해 주세요."))}</div></div>
  ${caveats.length ? `<div class="card"><h3>${esc(l.caveats)}</h3><ul class="flist">${[...new Set(caveats)].map((c) => `<li>${esc(c)}</li>`).join("")}</ul></div>` : ""}
  ${safetyNote(r, bad.length, lang)}
  <details class="bs"><summary>걸러낸 정보 <span class="count">${bad.length}건 · 신뢰성 판단</span></summary>${filtered(bad)}</details>${blockedBox(r.blocked)}${savedBox(r.saved)}
  <div class="meta bs">${esc(r.nvidia?.online ? `${r.nvidia.chat_model} · ${r.nvidia.embed_model} (설정값 · 실제 호출 결과는 별도 확인)` : "offline")}</div>`;
}
function culture({ turn = {}, result: r }) {
  const lang = normalizeLanguage(turn.language || r.language || turn.profile?.language || uiLanguage), l = I18N[lang];
  const localized = r.localized && normalizeLanguage(r.localized.language || lang) === lang ? r.localized : {};
  const names = displayNameMap(r, localized, lang);
  const text = (value, fallback = "") => visitorText(value, lang, names, fallback);
  const bad = (r.trust?.documents || []).filter((x) => !x.trusted && !(x.target || "").startsWith("beauty/"));
  const notices = (localized.notices || (lang === "ko" ? r.notices : []) || []).map((notice) => text(notice, l.translationPending)).filter(Boolean);
  const uncertainty = Object.entries(r.uncertain || {});
  const rawCaveats = uncertainty.flatMap(([, items]) => (Array.isArray(items) ? items : []).filter((item) => item.certainty && item.certainty !== "확정").map((item) => `${item.certainty} · ${item.sentence}`));
  const caveats = (localized.caveats || (lang === "ko" ? rawCaveats : [])).map((item) => text(item, l.translationPending)).filter(Boolean);
  const draft = text(localized.draft || matchingText(text(r.draft), lang), l.cultureFallback);
  return `<div class="culture-hero" role="img" aria-label="K-BeautyGate"></div><div class="card"><h3>${esc(l.culture)} <span class="subtitle">${shown(r.visit_date)}</span></h3><div class="bubble">${md(draft)}</div></div>
  ${notices.length ? `<div class="card"><h3>${esc(l.notices)}</h3><ul class="flist">${notices.map((notice) => `<li>${esc(notice)}</li>`).join("")}</ul></div>` : ""}
  ${publicText(r.food_cards) ? `<div class="card"><img class="card-rabbit" src="${RABBIT.card}" alt=""><h3>${esc(l.food)} <span class="subtitle">${esc(l.enlarge)}</span></h3><p class="note">${esc(l.staffHint)}</p><div class="staff" lang="ko" data-language="${lang}">${md(publicText(r.food_cards))}</div></div>` : ""}
  ${caveats.length ? `<div class="card"><h3>${esc(l.caveats)}</h3><ul class="flist">${[...new Set(caveats)].map((c) => `<li>${esc(c)}</li>`).join("")}</ul></div>` : ""}
  ${uncertainty.length ? `<details class="bs" open><summary>근거 확실성 <span class="count">문장별 확정 · 추정 · 측정 중 · 판독 불확실</span></summary><ul class="flist">${uncertainty.map(([k, v]) => `<li><strong>${esc(k)}</strong><br>${(Array.isArray(v) ? v : []).map((item) => `<span class="tag ${item.certainty === "확정" ? "ok" : ""}">${esc(item.certainty)}</span>${esc(item.sentence || item)}`).join("<br>")}</li>`).join("")}</ul>${(r.conflicts || []).length ? `<div class="note">${esc(r.conflicts.join(" / "))}</div>` : ""}</details>` : ""}
  ${safetyNote(r, bad.length, lang)}
  <details class="bs"><summary>걸러낸 자료 <span class="count">${bad.length}건</span></summary>${filtered(bad)}</details>${blockedBox(r.blocked)}${savedBox(r.saved)}`;
}
